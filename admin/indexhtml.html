<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Адмін-панель | SLM24.PL</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #e0e0e0; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: #1e1e1e; padding: 30px; border-radius: 8px; border: 1px solid #333; }
        h1, h2 { color: #d4af37; margin-top: 0; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 15px; margin-bottom: 25px; flex-wrap: wrap; gap: 10px; }
        .top-bar a { color: #fff; text-decoration: none; font-size: 14px; background: #333; padding: 8px 15px; border-radius: 4px; }
        label { display: block; margin: 12px 0 5px; font-size: 14px; color: #bbb; }
        input[type="text"], input[type="password"], textarea { width: 100%; padding: 10px; background: #121212; border: 1px solid #444; color: #fff; border-radius: 4px; box-sizing: border-box; }
        textarea { height: 70px; resize: vertical; }
        .btn { background: #d4af37; color: #121212; border: none; padding: 12px 24px; font-weight: bold; cursor: pointer; border-radius: 4px; font-size: 15px; margin-top: 15px; }
        .btn:hover { background: #c59b27; }
        .btn-danger { background: #c0392b; color: #fff; padding: 8px 14px; font-size: 13px; margin-top: 10px; }
        .btn-add { background: #27ae60; color: #fff; margin-bottom: 20px; }
        .product-item { background: #161616; border: 1px solid #333; padding: 20px; border-radius: 6px; margin-bottom: 20px; display: grid; grid-template-columns: 180px 1fr; gap: 20px; align-items: start; }
        .preview-box { width: 180px; height: 130px; background-size: cover; background-position: center; background-color: #222; border-radius: 4px; border: 1px solid #444; }
        .status { padding: 12px; border-radius: 4px; margin: 15px 0; display: none; font-weight: bold; }
        .status.ok { display: block; background: #1e4620; color: #a3cfbb; border: 1px solid #2b662e; }
        .status.err { display: block; background: #4a1c1c; color: #f5c6cb; border: 1px solid #722b2b; }
        .auth-box { background: #161616; padding: 15px; border-radius: 6px; margin-bottom: 25px; border: 1px dashed #d4af37; }
        @media (max-width: 650px) { .product-item { grid-template-columns: 1fr; } .preview-box { width: 100%; height: 180px; } }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <h1>⚙️ Керування сайтом SLM24.PL</h1>
        <a href="/">← Повернутися на сайт</a>
    </div>

    <div class="auth-box">
        <label>🔑 Ваш ключ доступу GitHub (Personal Access Token — зберігається лише у вашому браузері):</label>
        <input type="password" id="gh-token" placeholder="Вставте сюди ваш ключ ghp_..." onchange="saveToken()">
        <small style="color:#888; display:block; margin-top:5px;">Ключ потрібен один раз, щоб тільки ви могли публікувати зміни на сайт.</small>
    </div>

    <div id="status-msg" class="status"></div>

    <h2>1. Головний банер та Контакти</h2>
    <label>Головний заголовок (на банері):</label>
    <input type="text" id="site-title">

    <label>Підзаголовок:</label>
    <textarea id="site-subtitle"></textarea>

    <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px;">
        <div>
            <label>📞 Телефон / WhatsApp:</label>
            <input type="text" id="site-phone">
        </div>
        <div>
            <label>📍 Адреса салону:</label>
            <input type="text" id="site-address">
        </div>
        <div>
            <label>🕒 Години роботи:</label>
            <input type="text" id="site-hours">
        </div>
    </div>

    <hr style="border:0; border-top:1px solid #333; margin: 30px 0;">

    <h2>2. Каталог меблів (Картки товарів)</h2>
    <button class="btn btn-add" onclick="addProduct()">+ Додати нову картку меблів</button>

    <div id="products-container"></div>

    <button class="btn" style="width:100%; font-size:18px; padding:16px;" onclick="saveAllToGitHub()">💾 ЗБЕРЕГТИ ТА ОПУБЛІКУВАТИ НА САЙТ</button>
</div>

<script>
    const REPO = 'slm-meble/slm24.pl';
    const FILE_PATH = 'content/home.json';
    let siteData = {
        title: "EKSKLUZYWNE MEBLE DLA TWOJEGO DOMU",
        subtitle: "Kunszt, elegancja i najwyższy komfort. Odkryj kolekcję stworzoną z myślą o wyjątkowych wnętrzach.",
        contact_phone: "+48 666 688 298",
        contact_address: "Leśna 11, 63-604 Baranów",
        contact_hours: "Pn-Pt: 9:00 – 18:00",
        products: [
            {
                title: "Nowoczesne Sofy i Narożniki",
                description: "Ekskluzywne materiały, niezrównany komfort wypoczynku i bogata paleta kolorów.",
                price: "Na zamówienie",
                image: "https://images.unsplash.com/photo-1555041469-a586c61ea9bc?auto=format&fit=crop&w=800&q=80"
            },
            {
                title: "Eleganckie Łóżka Sypialniane",
                description: "Stworzone dla idealnego snu i luksusowego wyglądu Twojej sypialni.",
                price: "Na zamówienie",
                image: "https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?auto=format&fit=crop&w=800&q=80"
            },
            {
                title: "Meble na Wymiar i Dodatki",
                description: "Indywidualne projekty dostosowane do specyfiki i charakteru Twojego wnętrza.",
                price: "Indywidualnie",
                image: "https://images.unsplash.com/photo-1616486338812-3dadae4b4ace?auto=format&fit=crop&w=800&q=80"
            }
        ]
    };

    document.getElementById('gh-token').value = localStorage.getItem('slm_gh_token') || '';

    function saveToken() {
        localStorage.setItem('slm_gh_token', document.getElementById('gh-token').value.trim());
    }

    function showStatus(text, isError = false) {
        const el = document.getElementById('status-msg');
        el.textContent = text;
        el.className = 'status ' + (isError ? 'err' : 'ok');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderForm() {
        document.getElementById('site-title').value = siteData.title || '';
        document.getElementById('site-subtitle').value = siteData.subtitle || '';
        document.getElementById('site-phone').value = siteData.contact_phone || '+48 666 688 298';
        document.getElementById('site-address').value = siteData.contact_address || 'Leśna 11, 63-604 Baranów';
        document.getElementById('site-hours').value = siteData.contact_hours || 'Pn-Pt: 9:00 – 18:00';

        const container = document.getElementById('products-container');
        container.innerHTML = '';

        (siteData.products || []).forEach((prod, idx) => {
            const div = document.createElement('div');
            div.className = 'product-item';
            div.innerHTML = `
                <div>
                    <div class="preview-box" id="prev-${idx}" style="background-image: url('${prod.image}')"></div>
                    <label style="font-size:12px; margin-top:8px;">📷 Завантажити нове фото:</label>
                    <input type="file" accept="image/*" style="font-size:12px; width:100%;" onchange="uploadPhoto(event, ${idx})">
                </div>
                <div>
                    <label>Назва товару / колекції:</label>
                    <input type="text" value="${prod.title}" oninput="siteData.products[${idx}].title = this.value">
                    
                    <label>Опис:</label>
                    <textarea oninput="siteData.products[${idx}].description = this.value">${prod.description}</textarea>
                    
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                        <div>
                            <label>Ціна або статус (напр. 2500 zł або Na zamówienie):</label>
                            <input type="text" value="${prod.price}" oninput="siteData.products[${idx}].price = this.value">
                        </div>
                        <div>
                            <label>Посилання на фото (або завантажте зліва):</label>
                            <input type="text" id="img-url-${idx}" value="${prod.image}" oninput="siteData.products[${idx}].image = this.value; document.getElementById('prev-${idx}').style.backgroundImage = 'url('+this.value+')'">
                        </div>
                    </div>
                    <button class="btn btn-danger" onclick="removeProduct(${idx})">🗑 Видалити цю картку</button>
                </div>
            `;
            container.appendChild(div);
        });
    }

    function addProduct() {
        if (!siteData.products) siteData.products = [];
        siteData.products.unshift({
            title: "Nowa Kolekcja Mebli",
            description: "Opis nowego produktu...",
            price: "Na zamówienie",
            image: "https://images.unsplash.com/photo-1555041469-a586c61ea9bc?auto=format&fit=crop&w=800&q=80"
        });
        renderForm();
    }

    function removeProduct(idx) {
        if (confirm('Видалити цю картку товару?')) {
            siteData.products.splice(idx, 1);
            renderForm();
        }
    }

    async function uploadPhoto(event, idx) {
        const file = event.target.files[0];
        if (!file) return;
        const token = document.getElementById('gh-token').value.trim();
        if (!token) {
            alert('Спочатку вставте ваш ключ доступу GitHub у верхнє поле!');
            return;
        }

        showStatus('⏳ Завантаження фото на сервер GitHub...');
        const reader = new FileReader();
        reader.onload = async function(e) {
            const base64Content = e.target.result.split(',')[1];
            const cleanName = 'meble-' + Date.now() + '-' + file.name.replace(/[^a-zA-Z0-9.]/g, '');
            const path = 'images/' + cleanName;

            try {
                const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${path}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: 'Upload image ' + cleanName,
                        content: base64Content
                    })
                });
                if (!res.ok) throw new Error('Помилка завантаження фото. Перевірте ключ доступу.');
                
                const imageUrl = '/' + path;
                siteData.products[idx].image = imageUrl;
                document.getElementById('img-url-' + idx).value = imageUrl;
                document.getElementById('prev-' + idx).style.backgroundImage = `url('${e.target.result}')`;
                showStatus('✅ Фото успішно завантажено! Не забудьте натиснути "ЗБЕРЕГТИ ТА ОПУБЛІКУВАТИ" внизу.');
            } catch (err) {
                showStatus('❌ ' + err.message, true);
            }
        };
        reader.readAsDataURL(file);
    }

    async function saveAllToGitHub() {
        const token = document.getElementById('gh-token').value.trim();
        if (!token) {
            showStatus('❌ Будь ласка, введіть ваш ключ доступу GitHub у верхньому полі!', true);
            return;
        }

        siteData.title = document.getElementById('site-title').value;
        siteData.subtitle = document.getElementById('site-subtitle').value;
        siteData.contact_phone = document.getElementById('site-phone').value;
        siteData.contact_address = document.getElementById('site-address').value;
        siteData.contact_hours = document.getElementById('site-hours').value;

        showStatus('⏳ Збереження змін на сайт...');

        try {
            let sha = null;
            const getRes = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE_PATH}`, {
                headers: { 'Authorization': `token ${token}` }
            });
            if (getRes.ok) {
                const fileInfo = await getRes.json();
                sha = fileInfo.sha;
            }

            const jsonString = JSON.stringify(siteData, null, 2);
            const base64Data = btoa(unescape(encodeURIComponent(jsonString)));

            const bodyObj = {
                message: 'Update site content via Admin Panel',
                content: base64Data
            };
            if (sha) bodyObj.sha = sha;

            const putRes = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE_PATH}`, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(bodyObj)
            });

            if (!putRes.ok) throw new Error('Не вдалося зберегти. Перевірте правильність ключа GitHub.');
            showStatus('🎉 Усі зміни успішно опубліковано! Сайт оновиться протягом 30–60 секунд.');
        } catch (err) {
            showStatus('❌ Помилка: ' + err.message, true);
        }
    }

    fetch('/content/home.json?t=' + Date.now())
        .then(r => r.ok ? r.json() : null)
        .then(d => {
            if (d && d.title) {
                siteData = Object.assign(siteData, d);
                if (!siteData.products || siteData.products.length === 0) {
                    siteData.products = [
                        {
                            title: "Nowoczesne Sofy i Narożniki",
                            description: "Ekskluzywne materiały, niezrównany komfort wypoczynku i bogata paleta kolorów.",
                            price: "Na zamówienie",
                            image: "https://images.unsplash.com/photo-1555041469-a586c61ea9bc?auto=format&fit=crop&w=800&q=80"
                        },
                        {
                            title: "Eleganckie Łóżka Sypialniane",
                            description: "Stworzone dla idealnego snu i luksusowego wyglądu Twojej sypialni.",
                            price: "Na zamówienie",
                            image: "https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?auto=format&fit=crop&w=800&q=80"
                        },
                        {
                            title: "Meble na Wymiar i Dodatki",
                            description: "Indywidualne projekty dostosowane do specyfiki i charakteru Twojego wnętrza.",
                            price: "Indywidualnie",
                            image: "https://images.unsplash.com/photo-1616486338812-3dadae4b4ace?auto=format&fit=crop&w=800&q=80"
                        }
                    ];
                }
            }
            renderForm();
        })
        .catch(() => renderForm());
</script>

</body>
</html>
