<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Адмін-панель | SLM24.PL</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #e0e0e0; margin: 0; padding: 20px; }
        .container { max-width: 950px; margin: 0 auto; background: #1e1e1e; padding: 30px; border-radius: 8px; border: 1px solid #333; }
        h1, h2 { color: #d4af37; margin-top: 0; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 15px; margin-bottom: 25px; flex-wrap: wrap; gap: 10px; }
        .top-bar a { color: #fff; text-decoration: none; font-size: 14px; background: #333; padding: 8px 15px; border-radius: 4px; }
        label { display: block; margin: 12px 0 5px; font-size: 13px; color: #bbb; }
        input[type="text"], input[type="password"], textarea { width: 100%; padding: 10px; background: #121212; border: 1px solid #444; color: #fff; border-radius: 4px; box-sizing: border-box; font-size: 13px; }
        textarea { height: 70px; resize: vertical; }
        .btn { background: #d4af37; color: #121212; border: none; padding: 12px 24px; font-weight: bold; cursor: pointer; border-radius: 4px; font-size: 15px; margin-top: 15px; }
        .btn:hover { background: #c59b27; }
        .btn-danger { background: #c0392b; color: #fff; padding: 10px 16px; font-size: 13px; margin-top: 15px; width: 100%; }
        .btn-add { background: #27ae60; color: #fff; margin-bottom: 20px; width: 100%; padding: 14px; font-size: 16px; }
        .product-item { background: #161616; border: 1px solid #333; padding: 20px; border-radius: 6px; margin-bottom: 25px; }
        .photos-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; background: #111; padding: 12px; border-radius: 6px; border: 1px solid #333; margin-top: 8px; }
        .fabrics-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; background: #111; padding: 12px; border-radius: 6px; border: 1px solid #333; margin-top: 8px; }
        .status { padding: 12px; border-radius: 4px; margin: 15px 0; display: none; font-weight: bold; }
        .status.ok { display: block; background: #1e4620; color: #a3cfbb; border: 1px solid #2b662e; }
        .status.err { display: block; background: #4a1c1c; color: #f5c6cb; border: 1px solid #722b2b; }
        .auth-box { background: #161616; padding: 15px; border-radius: 6px; margin-bottom: 25px; border: 1px dashed #d4af37; }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <h1>⚙️ Керування сайтом SLM24.PL</h1>
        <a href="/">← Повернутися на сайт</a>
    </div>

    <div class="auth-box">
        <label>🔑 Ваш ключ доступу GitHub (Personal Access Token):</label>
        <input type="password" id="gh-token" placeholder="Вставте сюди ваш ключ ghp_..." onchange="saveToken()">
        <small style="color:#888; display:block; margin-top:5px;">Ключ зберігається лише у вашому браузері.</small>
    </div>

    <div id="status-msg" class="status"></div>

    <h2>1. Налаштування головної сторінки та Банера</h2>
    <label>Головний заголовок:</label>
    <input type="text" id="site-title">

    <label>Підзаголовок:</label>
    <textarea id="site-subtitle"></textarea>

    <label>🖼️ Посилання на фонову фотографію головного банера:</label>
    <input type="text" id="site-hero-bg" placeholder="https://...">

    <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-top:10px;">
        <div>
            <label>📞 Телефон / WhatsApp:</label>
            <input type="text" id="site-phone">
        </div>
        <div>
            <label>📍 Адреса салону:</label>
            <input type="text" id="site-address">
        </div>
        <div>
            <label>🕒 Години роботи:</label>
            <input type="text" id="site-hours">
        </div>
    </div>

    <hr style="border:0; border-top:1px solid #333; margin: 30px 0;">

    <h2>2. Каталог меблів</h2>
    <button class="btn btn-add" onclick="addProduct()">+ Додати нову картку меблів (повністю чисту)</button>

    <div id="products-container"></div>

    <button class="btn" style="width:100%; font-size:18px; padding:16px; margin-top:20px;" onclick="saveAllToGitHub()">💾 ЗБЕРЕГТИ ТА ОПУБЛІКУВАТИ НА САЙТ</button>
</div>

<script>
    const REPO = 'slm-meble/slm24.pl';
    const FILE_PATH = 'content/home.json';
    let siteData = { title: "", subtitle: "", hero_bg: "", contact_phone: "", contact_address: "", contact_hours: "", products: [] };

    document.getElementById('gh-token').value = localStorage.getItem('slm_gh_token') || '';

    function saveToken() {
        localStorage.setItem('slm_gh_token', document.getElementById('gh-token').value.trim());
    }

    function showStatus(text, isError = false) {
        const el = document.getElementById('status-msg');
        el.textContent = text;
        el.className = 'status ' + (isError ? 'err' : 'ok');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderForm() {
        document.getElementById('site-title').value = siteData.title || '';
        document.getElementById('site-subtitle').value = siteData.subtitle || '';
        document.getElementById('site-hero-bg').value = siteData.hero_bg || '';
        document.getElementById('site-phone').value = siteData.contact_phone || '';
        document.getElementById('site-address').value = siteData.contact_address || '';
        document.getElementById('site-hours').value = siteData.contact_hours || '';

        const container = document.getElementById('products-container');
        container.innerHTML = '';

        (siteData.products || []).forEach((prod, idx) => {
            // Розбиваємо посилання на масиви (або створюємо пусті)
            let imgs = (prod.images || prod.image || '').split(',').map(s => s.trim());
            while(imgs.length < 10) imgs.push('');

            let fabs = (prod.fabric_images || '').split(',').map(s => s.trim());
            while(fabs.length < 3) fabs.push('');

            const div = document.createElement('div');
            div.className = 'product-item';
            
            let photosHtml = '';
            for(let i = 0; i < 10; i++) {
                photosHtml += `
                    <div>
                        <label style="font-size:11px;">Фото ${i+1}:</label>
                        <input type="text" id="prod-${idx}-img-${i}" value="${imgs[i] || ''}" placeholder="https://..." oninput="updateProductImgs(${idx})">
                    </div>
                `;
            }

            let fabricsHtml = '';
            for(let i = 0; i < 3; i++) {
                fabricsHtml += `
                    <div>
                        <label style="font-size:11px;">Тканина ${i+1}:</label>
                        <input type="text" id="prod-${idx}-fab-${i}" value="${fabs[i] || ''}" placeholder="https://..." oninput="updateProductFabrics(${idx})">
                    </div>
                `;
            }

            div.innerHTML = `
                <label><strong>Назва товару:</strong></label>
                <input type="text" value="${prod.name || prod.title || ''}" oninput="siteData.products[${idx}].title = this.value; siteData.products[${idx}].name = this.value;">
                
                <label><strong>Ціна:</strong></label>
                <input type="text" value="${prod.price || ''}" oninput="siteData.products[${idx}].price = this.value">

                <label><strong>Опис товару:</strong></label>
                <textarea oninput="siteData.products[${idx}].description = this.value">${prod.description || ''}</textarea>

                <label><strong>📷 Галерея фотографій (до 10 посилань):</strong></label>
                <div class="photos-grid">${photosHtml}</div>

                <label style="margin-top:15px;"><strong>🧵 Лінійка тканин (3 фотографії):</strong></label>
                <div class="fabrics-grid">${fabricsHtml}</div>

                <button class="btn btn-danger" onclick="removeProduct(${idx})">🗑 Видалити цю картку товару</button>
            `;
            container.appendChild(div);
        });
    }

    function updateProductImgs(idx) {
        let arr = [];
        for(let i = 0; i < 10; i++) {
            let val = document.getElementById(`prod-${idx}-img-${i}`).value.trim();
            if(val) arr.push(val);
        }
        siteData.products[idx].images = arr.join(',');
        siteData.products[idx].image = arr[0] || ''; // головне фото для сітки
    }

    function updateProductFabrics(idx) {
        let arr = [];
        for(let i = 0; i < 3; i++) {
            let val = document.getElementById(`prod-${idx}-fab-${i}`).value.trim();
            if(val) arr.push(val);
        }
        siteData.products[idx].fabric_images = arr.join(',');
    }

    function addProduct() {
        if (!siteData.products) siteData.products = [];
        // Абсолютно порожня картка без будь-яких зайвих даних чи старих диванів
        siteData.products.unshift({
            title: "",
            name: "",
            description: "",
            price: "",
            image: "",
            images: "",
            fabric_images: ""
        });
        renderForm();
    }

    function removeProduct(idx) {
        if (confirm('Видалити цю картку товару?')) {
            siteData.products.splice(idx, 1);
            renderForm();
        }
    }

    async function saveAllToGitHub() {
        const token = document.getElementById('gh-token').value.trim();
        if (!token) {
            showStatus('❌ Будь ласка, введіть ваш ключ доступу GitHub у верхньому полі!', true);
            return;
        }

        siteData.title = document.getElementById('site-title').value;
        siteData.subtitle = document.getElementById('site-subtitle').value;
        siteData.hero_bg = document.getElementById('site-hero-bg').value;
        siteData.contact_phone = document.getElementById('site-phone').value;
        siteData.contact_address = document.getElementById('site-address').value;
        siteData.contact_hours = document.getElementById('site-hours').value;

        showStatus('⏳ Збереження змін на сайт...');

        try {
            let sha = null;
            const getRes = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE_PATH}`, {
                headers: { 'Authorization': `token ${token}` }
            });
            if (getRes.ok) {
                const fileInfo = await getRes.json();
                sha = fileInfo.sha;
            }

            const jsonString = JSON.stringify(siteData, null, 2);
            const base64Data = btoa(unescape(encodeURIComponent(jsonString)));

            const bodyObj = {
                message: 'Update site content via Admin Panel (10 photos & fabrics)',
                content: base64Data
            };
            if (sha) bodyObj.sha = sha;

            const putRes = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE_PATH}`, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(bodyObj)
            });

            if (!putRes.ok) throw new Error('Не вдалося зберегти. Перевірте правильність ключа GitHub.');
            showStatus('🎉 Усі зміни успішно опубліковано! Сайт оновиться протягом 30–60 секунд.');
        } catch (err) {
            showStatus('❌ Помилка: ' + err.message, true);
        }
    }

    fetch('/content/home.json?t=' + Date.now())
        .then(r => r.ok ? r.json() : null)
        .then(d => {
            if (d) {
                siteData = Object.assign(siteData, d);
            }
            renderForm();
        })
        .catch(() => renderForm());
</script>

</body>
</html>
